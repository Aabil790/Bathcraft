        let currentDiscount = 0;
        let currentCategory = "All";
        let cart = [];
        let filteredProductsList = [];
        let renderedCount = 0;
        const BATCH_SIZE = 24;
        let debounceTimer;

        // Tracks selected variant index for each product
        let selectedVariantMap = {};

        function getCategories() {
            const categories = ["All", ...new Set(productsData.map(p => p.category))];
            const filterContainer = document.getElementById("categoryFilter");
            filterContainer.innerHTML = "";

            categories.forEach(cat => {
                const btn = document.createElement("button");
                btn.className = `cat-chip ${cat === currentCategory ? 'active' : ''}`;
                btn.innerText = cat;
                btn.onclick = () => {
                    currentCategory = cat;
                    document.querySelectorAll('.cat-chip').forEach(c => c.classList.remove('active'));
                    btn.classList.add('active');
                    filterProducts();
                };
                filterContainer.appendChild(btn);
            });
        }

        function createCardHTML(product) {
            const cleanId = product.artNo.replace(/[^a-zA-Z0-9]/g, '');
            const selectedIdx = selectedVariantMap[product.artNo] || 0;
            const currentVariant = product.variants[selectedIdx] || product.variants[0];

            const discountedPrice = currentDiscount > 0 
                ? (currentVariant.mrp - (currentVariant.mrp * currentDiscount / 100)).toFixed(2) 
                : currentVariant.mrp;

            // Generate options dropdown for multiple sizes
            let variantOptionsHtml = "";
            product.variants.forEach((v, idx) => {
                variantOptionsHtml += `<option value="${idx}" ${idx === selectedIdx ? 'selected' : ''}>${v.size} (MRP: ₹${v.mrp})</option>`;
            });

            return `
                <div class="card" id="card-${cleanId}">
                    <div>
                        <div class="img-container" onclick="openModal('${product.img}', '${product.artNo} - ${product.name}', '${currentVariant.packing}', ${currentVariant.mrp}, '${currentVariant.size}')">
                            <img src="${product.img}" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';" alt="${product.name}">
                            <div style="display:none; font-size:0.8rem; color:#94a3b8; font-weight:700;">${product.artNo}</div>
                        </div>
                        <div class="card-header-row">
                            <span class="art-no">${product.artNo}</span>
                            <span class="cat-badge">${product.category}</span>
                        </div>
                        <div class="product-title">${product.name}</div>
                        
                        <div class="variant-selector-box">
                            <label>Select Size / Model:</label>
                            <select class="variant-select" onchange="onVariantChange('${product.artNo}', this.value)">
                                ${variantOptionsHtml}
                            </select>
                        </div>

                        <div class="packing-tag" id="packing-${cleanId}">📦 ${currentVariant.packing}</div>
                    </div>
                    <div>
                        <div class="price-section" id="price-sec-${cleanId}">
                            <div class="price-row">
                                <span style="font-weight:600; color:#475569;">Net Rate:</span>
                                <div>
                                    ${currentDiscount > 0 ? `<span class="mrp-strike">₹${currentVariant.mrp}</span>` : ''}
                                    <span class="final-price ${currentDiscount > 0 ? 'discounted' : ''}">₹${discountedPrice}</span>
                                </div>
                            </div>
                        </div>

                        <div class="carton-order-row">
                            <div class="carton-input-box">
                                <button onclick="changeCardCarton('${product.artNo}', -1)">-</button>
                                <input type="number" id="input-${cleanId}" value="1" min="1" max="999">
                                <button onclick="changeCardCarton('${product.artNo}', 1)">+</button>
                            </div>
                            <button class="btn btn-carton-add" onclick="addCartonToCart('${product.artNo}')">
                                🛒 Add Carton
                            </button>
                        </div>
                    </div>
                </div>
            `;
        }

        // Live variant switch without re-rendering the whole page
        function onVariantChange(artNo, variantIndex) {
            const idx = parseInt(variantIndex);
            selectedVariantMap[artNo] = idx;
            const product = productsData.find(p => p.artNo === artNo);
            if (!product) return;
            const cleanId = artNo.replace(/[^a-zA-Z0-9]/g, '');
            const v = product.variants[idx];

            document.getElementById(`packing-${cleanId}`).innerText = `📦 ${v.packing}`;
            
            const discountedPrice = currentDiscount > 0 
                ? (v.mrp - (v.mrp * currentDiscount / 100)).toFixed(2) 
                : v.mrp;

            document.getElementById(`price-sec-${cleanId}`).innerHTML = `
                <div class="price-row">
                    <span style="font-weight:600; color:#475569;">Net Rate:</span>
                    <div>
                        ${currentDiscount > 0 ? `<span class="mrp-strike">₹${v.mrp}</span>` : ''}
                        <span class="final-price ${currentDiscount > 0 ? 'discounted' : ''}">₹${discountedPrice}</span>
                    </div>
                </div>
            `;
        }

        function changeCardCarton(artNo, delta) {
            const cleanId = artNo.replace(/[^a-zA-Z0-9]/g, '');
            const input = document.getElementById(`input-${cleanId}`);
            if (!input) return;
            let val = parseInt(input.value) || 1;
            val = Math.max(1, val + delta);
            input.value = val;
        }

        function addCartonToCart(artNo) {
            const product = productsData.find(p => p.artNo === artNo);
            if (!product) return;
            const cleanId = artNo.replace(/[^a-zA-Z0-9]/g, '');
            const input = document.getElementById(`input-${cleanId}`);
            const cartons = parseInt(input.value) || 1;

            const selectedIdx = selectedVariantMap[artNo] || 0;
            const variant = product.variants[selectedIdx];
            const netPricePerPc = currentDiscount > 0 ? (variant.mrp - (variant.mrp * currentDiscount / 100)) : variant.mrp;
            const pcs = variant.pcs || 1;

            // Match both artNo AND size so every size has separate row in cart
            const existing = cart.find(item => item.artNo === artNo && item.size === variant.size);
            if (existing) {
                existing.cartons += cartons;
                existing.totalPcs = existing.cartons * pcs;
            } else {
                cart.push({
                    artNo: product.artNo,
                    name: product.name,
                    size: variant.size,
                    mrp: variant.mrp,
                    netPricePerPc: netPricePerPc,
                    pcsPerCarton: pcs,
                    cartons: cartons,
                    totalPcs: cartons * pcs,
                    img: product.img
                });
            }
            updateCartBar();
            alert(`✅ Added ${cartons} Carton(s) of ${product.artNo} [${variant.size}] (${cartons * pcs} Pcs) to cart!`);
        }

        function renderNextBatch() {
            const grid = document.getElementById("productGrid");
            const nextBatch = filteredProductsList.slice(renderedCount, renderedCount + BATCH_SIZE);
            if (nextBatch.length > 0) {
                const fragment = document.createRange().createContextualFragment(nextBatch.map(createCardHTML).join(""));
                grid.appendChild(fragment);
                renderedCount += nextBatch.length;
            }
        }

        function debouncedSearch() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => { filterProducts(); }, 250);
        }

        function filterProducts() {
            const query = document.getElementById("searchInput").value.trim().toLowerCase();
            filteredProductsList = productsData.filter(p => {
                const matchesCat = currentCategory === "All" || p.category === currentCategory;
                const matchesSearch = !query || 
                                      p.name.toLowerCase().includes(query) || 
                                      p.artNo.toLowerCase().includes(query) || 
                                      p.category.toLowerCase().includes(query) ||
                                      p.variants.some(v => v.size.toLowerCase().includes(query));
                return matchesCat && matchesSearch;
            });

            const grid = document.getElementById("productGrid");
            grid.innerHTML = "";
            renderedCount = 0;

            if (filteredProductsList.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; padding: 40px; color: #64748b;">No products found.</div>`;
                return;
            }
            renderNextBatch();
        }

        function updateCartonQtyInModal(index, newCartonVal) {
            if (!cart[index]) return;
            let val = parseInt(newCartonVal);
            if (isNaN(val) || val <= 0) {
                cart.splice(index, 1);
            } else {
                cart[index].cartons = val;
                cart[index].totalPcs = val * cart[index].pcsPerCarton;
            }
            updateCartBar();
            renderCartModal();
        }

        function updateCartBar() {
            const totalCartons = cart.reduce((sum, i) => sum + i.cartons, 0);
            const totalPcs = cart.reduce((sum, i) => sum + i.totalPcs, 0);
            const totalNet = cart.reduce((sum, i) => sum + (i.netPricePerPc * i.totalPcs), 0).toFixed(2);
            document.getElementById("cartSummary").children[0].innerText = `🛒 Cart: ${totalCartons} Cartons (${totalPcs} Pcs) | Total Net: ₹${totalNet}`;
            document.getElementById("discountNote").innerText = `Current Discount: ${currentDiscount}% OFF`;
        }

        function clearCart() {
            cart = [];
            updateCartBar();
            closeCartModal();
        }

        function openCartModal() {
            renderCartModal();
            document.getElementById("cartModal").style.display = "flex";
        }

        function closeCartModal() {
            document.getElementById("cartModal").style.display = "none";
        }

        function renderCartModal() {
            const container = document.getElementById("cartModalContent");
            if (cart.length === 0) {
                container.innerHTML = `<p style="padding: 20px; color: #64748b; text-align:center;">Cart is empty.</p>`;
                return;
            }

            let total = 0;
            let rowsHtml = "";
            cart.forEach((item, idx) => {
                const rowTotal = item.netPricePerPc * item.totalPcs;
                total += rowTotal;
                rowsHtml += `
                    <tr>
                        <td><strong>${item.artNo}</strong><br><small style="color:#0284c7; font-weight:700;">Size: ${item.size}</small><br><span style="font-size:0.75rem; color:#64748b;">(${item.pcsPerCarton} Pcs/Ctn)</span></td>
                        <td>
                            <div style="display:inline-flex; align-items:center; gap:3px;">
                                <button class="btn" style="padding:2px 7px;" onclick="updateCartonQtyInModal(${idx}, ${item.cartons - 1})">-</button>
                                <input type="number" style="width:45px; text-align:center; padding:3px; font-weight:bold;" value="${item.cartons}" onchange="updateCartonQtyInModal(${idx}, this.value)">
                                <button class="btn" style="padding:2px 7px;" onclick="updateCartonQtyInModal(${idx}, ${item.cartons + 1})">+</button>
                            </div>
                            <div style="font-size:0.75rem; color:#475569; margin-top:2px;">= ${item.totalPcs} Pcs</div>
                        </td>
                        <td>₹${item.netPricePerPc.toFixed(2)}/pc</td>
                        <td><strong>₹${rowTotal.toFixed(2)}</strong></td>
                    </tr>
                `;
            });

            container.innerHTML = `
                <table class="cart-table">
                    <thead><tr><th>Product & Size</th><th>Cartons</th><th>Rate</th><th>Total</th></tr></thead>
                    <tbody>${rowsHtml}
                        <tr style="background:#f8fafc;">
                            <td colspan="3" style="text-align:right; font-weight:bold;">Total Payable Amount:</td>
                            <td style="color:#16a34a; font-weight:bold; font-size:0.95rem;">₹${total.toFixed(2)}</td>
                        </tr>
                    </tbody>
                </table>
            `;
        }

        function sendWhatsAppOrder() {
            if (cart.length === 0) {
                alert("Cart is empty! Please add products before sending quote.");
                return;
            }

            const baseUrl = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, '/');

            let msg = `*BATH CRAFT PREMIUM 2026 - PURCHASE INQUIRY*\n`;
            msg += `Maa Lalitamba Impex, Bawana, Delhi\n`;
            msg += `----------------------------------------\n`;
            msg += `*Applied Discount Rate:* ${currentDiscount}%\n\n`;
            
            let total = 0;
            let totalCartons = 0;
            let totalPcs = 0;
            cart.forEach((item, index) => {
                const itemTotal = item.netPricePerPc * item.totalPcs;
                total += itemTotal;
                totalCartons += item.cartons;
                totalPcs += item.totalPcs;

                const photoUrl = baseUrl + item.img;

                msg += `${index + 1}. *${item.artNo}* - ${item.name}\n`;
                msg += `   📐 Size: *${item.size}*\n`;
                msg += `   📦 *${item.cartons} Carton(s)* = ${item.totalPcs} Pcs (${item.pcsPerCarton} Pcs/Box)\n`;
                msg += `   💵 Rate: ₹${item.netPricePerPc.toFixed(2)}/pc | Total: ₹${itemTotal.toFixed(2)}\n`;
                msg += `   📸 Photo View: ${photoUrl}\n\n`;
            });

            msg += `----------------------------------------\n`;
            msg += `*SUMMARY:* ${totalCartons} Cartons (${totalPcs} Total Pieces)\n`;
            msg += `*GRAND TOTAL AMOUNT: ₹${total.toFixed(2)}*\n`;
            msg += `----------------------------------------\n`;
            msg += `Please confirm order availability and dispatch timeline.`;

            const whatsappUrl = `https://wa.me/918003700735?text=${encodeURIComponent(msg)}`;
            window.open(whatsappUrl, '_blank');
        }

        function openModal(imgSrc, title, packing, baseMrp, sizeName) {
            const modalImg = document.getElementById("modalImage");
            modalImg.src = imgSrc;
            document.getElementById("modalTitle").innerText = title;
            document.getElementById("modalSub").innerText = packing ? `Model: ${sizeName || ''} • ${packing}` : "";
            
            const netRate = currentDiscount > 0 ? (baseMrp - (baseMrp * currentDiscount / 100)).toFixed(2) : baseMrp;
            const priceHtml = `
                <div>
                    ${currentDiscount > 0 ? `<span style="text-decoration:line-through; color:#94a3b8; margin-right:6px;">MRP: ₹${baseMrp}</span>` : ''}
                    <strong style="color:#16a34a; font-size:1.1rem;">Net Price: ₹${netRate}</strong>
                    ${currentDiscount > 0 ? `<span style="background:#e0f2fe; color:#0284c7; padding:2px 6px; border-radius:4px; font-weight:bold; font-size:0.75rem; margin-left:6px;">${currentDiscount}% OFF</span>` : ''}
                </div>
            `;
            document.getElementById("modalPriceBox").innerHTML = priceHtml;
            document.getElementById("imgModal").style.display = "flex";
        }

        function closeModal() {
            document.getElementById("imgModal").style.display = "none";
        }

        function setDiscount(percent) {
            currentDiscount = percent;
            document.getElementById("discountInput").value = percent;
            document.querySelectorAll('.discount-buttons .btn').forEach(btn => {
                btn.classList.remove('active-disc');
                if (btn.innerText.includes(`${percent}%`)) btn.classList.add('active-disc');
            });
            recalculateCartPrices();
            filterProducts();
        }

        function applyCustomDiscount() {
            currentDiscount = parseFloat(document.getElementById("discountInput").value) || 0;
            recalculateCartPrices();
            filterProducts();
        }

        function recalculateCartPrices() {
            cart.forEach(item => {
                item.netPricePerPc = currentDiscount > 0 ? (item.mrp - (item.mrp * currentDiscount / 100)) : item.mrp;
            });
            updateCartBar();
            if (document.getElementById("cartModal").style.display === "flex") {
                renderCartModal();
            }
        }

        window.addEventListener('scroll', () => {
            if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 500) {
                if (renderedCount < filteredProductsList.length) renderNextBatch();
            }
        }, { passive: true });

        // Initialize App
        getCategories();
        filterProducts();
    </script>
</body>
</html>
